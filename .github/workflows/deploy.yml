name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
          PM2_APP: ${{ secrets.PM2_APP }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY PROJECT_PATH PM2_APP; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing or empty. Add it in Repo Settings → Secrets and variables → Actions."
              missing=1
            else
              echo "Secret $name is set."
            fi
          done
          exit $missing

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
          PM2_APP: ${{ secrets.PM2_APP }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 20m
          envs: PROJECT_PATH,PM2_APP
          script: |
            set -euo pipefail
            echo "Deploying in: $PROJECT_PATH"
            cd "$PROJECT_PATH"
            git fetch origin
            git reset --hard origin/main
            npm install
            npm run build
            pm2 restart "$PM2_APP" --update-env
            pm2 save

            # Raise nginx body size so Orbit hero videos (<=100MB) are not rejected with HTTP 413
            if [ -f "$PROJECT_PATH/deploy/nginx-client-max-body.conf" ]; then
              if command -v nginx >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1; then
                if sudo -n true 2>/dev/null; then
                  sudo cp "$PROJECT_PATH/deploy/nginx-client-max-body.conf" /etc/nginx/conf.d/zz-summit-seek-upload.conf
                  if sudo nginx -t; then
                    sudo systemctl reload nginx || sudo service nginx reload || true
                    echo "Nginx client_max_body_size set to 100m."
                  else
                    echo "WARN: nginx -t failed; left previous nginx config in place."
                    sudo rm -f /etc/nginx/conf.d/zz-summit-seek-upload.conf || true
                  fi
                else
                  echo "WARN: passwordless sudo unavailable — could not set nginx client_max_body_size 100m."
                  echo "Manually add: client_max_body_size 100m;  then reload nginx."
                fi
              else
                echo "Nginx not found or sudo missing — skipping upload-limit nginx snippet."
              fi
            fi

            echo "Deploy finished."
