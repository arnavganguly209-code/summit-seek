name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing or empty. Add it in Repo Settings → Secrets and variables → Actions."
              missing=1
            else
              echo "Secret $name is set."
            fi
          done
          echo "Fixed deploy target: PROJECT_PATH=/var/www/summit-seek PM2_APP=summit-seek"
          # Basic shape checks (no secret values printed)
          echo "VPS_HOST length: ${#VPS_HOST}"
          echo "VPS_USER length: ${#VPS_USER}"
          echo "VPS_SSH_KEY length: ${#VPS_SSH_KEY}"
          if ! printf '%s' "$VPS_SSH_KEY" | grep -q "BEGIN.*PRIVATE KEY"; then
            echo "::error::VPS_SSH_KEY does not look like a private key (missing BEGIN PRIVATE KEY header)."
            missing=1
          fi
          exit $missing

      - name: Preflight TCP check (port 22)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set +e
          echo "Checking TCP connectivity to ${VPS_HOST}:22 ..."
          for i in $(seq 1 12); do
            if timeout 12 bash -c "echo >/dev/tcp/${VPS_HOST}/22" 2>/dev/null; then
              echo "Port 22 is reachable (attempt $i)."
              exit 0
            fi
            echo "Attempt $i failed — waiting..."
            sleep $((i * 4))
          done
          echo "::error::Cannot reach ${VPS_HOST}:22 from GitHub Actions. VPS may be down, SSH blocked, or firewall/fail2ban is rejecting GitHub IPs. Retry the workflow once the host is reachable."
          exit 1

      - name: Deploy via OpenSSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write key with exact newlines (handles escaped \n from secrets UI)
          printf '%s\n' "$VPS_SSH_KEY" | sed 's/\r$//' > ~/.ssh/deploy_key
          if ! grep -q "BEGIN.*PRIVATE KEY" ~/.ssh/deploy_key; then
            # Secret may be stored with literal \n sequences
            printf '%s\n' "$VPS_SSH_KEY" | sed 's/\\n/\n/g' | sed 's/\r$//' > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          # Known hosts — retry keyscan
          for i in $(seq 1 10); do
            if ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "Host key captured (attempt $i)."
              break
            fi
            echo "ssh-keyscan attempt $i failed..."
            sleep $((i * 3))
            if [ "$i" = "10" ]; then
              echo "::error::ssh-keyscan failed for $VPS_HOST. Host unreachable or SSH not responding."
              exit 1
            fi
          done

          SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=45 -o ServerAliveInterval=15 -o ServerAliveCountMax=8)

          echo "Connecting as ${VPS_USER}@${VPS_HOST} ..."
          # One soft retry if first SSH attempt fails (transient network)
          if ! "${SSH[@]}" "${VPS_USER}@${VPS_HOST}" "echo ssh-ok"; then
            echo "First SSH probe failed — retrying in 20s..."
            sleep 20
            "${SSH[@]}" "${VPS_USER}@${VPS_HOST}" "echo ssh-ok"
          fi

          # Fixed Summit Seek targets (never from secrets — prevents cross-project deploy)
          "${SSH[@]}" "${VPS_USER}@${VPS_HOST}" bash -s <<'EOF'
          set -euo pipefail
          PROJECT_PATH=/var/www/summit-seek
          PM2_APP=summit-seek
          echo "Deploying in: ${PROJECT_PATH}"
          cd "${PROJECT_PATH}"
          git fetch origin
          git reset --hard origin/main
          echo "Checked out: $(git rev-parse --short HEAD)"

          if [ ! -f .env.local ] || ! grep -q '^ORBIT_PASSKEY=' .env.local 2>/dev/null; then
            echo 'ORBIT_PASSKEY=713304977' >> .env.local || true
            echo "Orbit .env.local ensured."
          fi

          # Durable media storage (NOT wiped by git reset)
          mkdir -p storage/media/library storage/media/.uploads data
          mkdir -p public/media/hero public/media/library public/media/.uploads

          # Nginx upload limit (best-effort)
          if [ -f deploy/nginx-client-max-body.conf ]; then
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              sudo cp deploy/nginx-client-max-body.conf /etc/nginx/conf.d/summit-seek-uploads.conf || true
              sudo nginx -t && (sudo systemctl reload nginx || sudo service nginx reload) || true
              echo "Nginx upload limit applied (or skipped)."
            elif [ "$(id -u)" = "0" ]; then
              cp deploy/nginx-client-max-body.conf /etc/nginx/conf.d/summit-seek-uploads.conf || true
              nginx -t && (systemctl reload nginx || service nginx reload) || true
            else
              echo "Skipping nginx upload limit (no passwordless sudo)."
            fi
          fi

          npm install --no-audit --no-fund
          rm -rf .next
          npm run build
          pm2 restart "${PM2_APP}" --update-env
          pm2 save
          echo "Deploy finished: $(git rev-parse --short HEAD)"
          EOF

          echo "Remote deploy completed."
