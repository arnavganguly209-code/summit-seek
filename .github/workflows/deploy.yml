name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
          PM2_APP: ${{ secrets.PM2_APP }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY PROJECT_PATH PM2_APP; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing or empty. Add it in Repo Settings → Secrets and variables → Actions."
              missing=1
            else
              echo "Secret $name is set."
            fi
          done
          exit $missing

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
          PM2_APP: ${{ secrets.PM2_APP }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          timeout: 60s
          command_timeout: 25m
          max_attempts: 3
          envs: PROJECT_PATH,PM2_APP
          script: |
            set -euo pipefail
            echo "Deploying in: $PROJECT_PATH"
            cd "$PROJECT_PATH"
            git fetch origin
            git reset --hard origin/main

            if [ ! -f .env.local ] || ! grep -q '^ORBIT_PASSKEY=' .env.local 2>/dev/null; then
              echo 'ORBIT_PASSKEY=713304977' >> .env.local || true
              echo "Orbit .env.local ensured."
            fi

            # Raise nginx upload limit for Orbit hero/media (idempotent)
            if [ -f deploy/nginx-client-max-body.conf ]; then
              if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
                sudo cp deploy/nginx-client-max-body.conf /etc/nginx/conf.d/summit-seek-uploads.conf
                if sudo nginx -t; then
                  sudo systemctl reload nginx || sudo service nginx reload || true
                  echo "Nginx client_max_body_size applied."
                else
                  echo "Nginx config test failed — skipped reload."
                fi
              elif [ "$(id -u)" = "0" ]; then
                cp deploy/nginx-client-max-body.conf /etc/nginx/conf.d/summit-seek-uploads.conf
                nginx -t && (systemctl reload nginx || service nginx reload || true)
                echo "Nginx client_max_body_size applied as root."
              else
                echo "Skipping nginx upload limit (no passwordless sudo)."
              fi
            fi

            mkdir -p public/media/library public/media/hero public/media/.uploads

            npm install --no-audit --no-fund
            npm run build
            pm2 restart "$PM2_APP" --update-env
            pm2 save
            echo "Deploy finished."
